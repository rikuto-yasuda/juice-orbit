[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "juice-orbit"
version = "0.1.0"
description = "JUICE CReMA SPICE orbit queries and plots"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "spiceypy>=6,<8",
    "numpy>=1.24,<3",
    "pandas>=2,<3",
    "matplotlib>=3.7,<4",
]

[tool.setuptools.packages.find]
where = ["src"]
